# Stack Pulsar per Coolify (build pack "Docker Compose").
# Differenze rispetto a docker-compose.yml (sviluppo locale):
# - nessuna porta pubblicata sull'host: il traffico passa dal proxy di Coolify
# - nessun container_name / nome di rete fisso: li gestisce Coolify
# Il dominio del servizio pulsar-server va assegnato in Coolify con la porta interna :8000
services:
  postgres:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-sysmon}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD obbligatoria}
      POSTGRES_DB: ${POSTGRES_DB:-sysmon_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-sysmon} -d ${POSTGRES_DB:-sysmon_db}" ]
      interval: 10s
      timeout: 5s
      retries: 5

  pulsar-server:
    build:
      context: .
      dockerfile: server/Dockerfile
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-sysmon}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-sysmon_db}
      PULSAR_SERVER_TOKEN: ${PULSAR_SERVER_TOKEN:-}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      PORT: 8000
    expose:
      - "8000"

volumes:
  postgres_data:
