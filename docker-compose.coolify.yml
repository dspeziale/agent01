# Stack Pulsar per Coolify (build pack "Docker Compose").
# Differenze rispetto a docker-compose.yml (sviluppo locale):
# - usa l'istanza PostgreSQL gestita da Coolify (DATABASE_URL = "Postgres URL (internal)")
#   raggiungibile tramite la rete Docker "coolify"
# - server pubblicato sulla porta host ${PULSAR_HOST_PORT:-8800}: rete solo locale,
#   nessun dominio/DNS (es. http://10.20.23.64:8800)
# - nessun container_name: lo gestisce Coolify
services:
  pulsar-server:
    build:
      context: .
      dockerfile: server/Dockerfile
    restart: always
    environment:
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL obbligatoria}
      PULSAR_SERVER_TOKEN: ${PULSAR_SERVER_TOKEN:-}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      PORT: 8000
    ports:
      - "${PULSAR_HOST_PORT:-8800}:8000"
    networks:
      - coolify

networks:
  coolify:
    external: true
