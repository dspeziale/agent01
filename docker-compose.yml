services:
  # -------------------------------------------------------------
  # Database PostgreSQL 16
  # -------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: sysmon-postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-sysmon}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sysmon_secure_password_123}
      POSTGRES_DB: ${POSTGRES_DB:-sysmon_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      # Esposta per consentire accesso diretto da DBeaver, pgAdmin o strumenti esterni
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-sysmon} -d ${POSTGRES_DB:-sysmon_db}" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - sysmon-net

  # -------------------------------------------------------------
  # Sysmon Backend API (FastAPI + Uvicorn)
  # -------------------------------------------------------------
  sysmon-server:
    build:
      context: .
      dockerfile: server/Dockerfile
    container_name: sysmon-server
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-sysmon}:${POSTGRES_PASSWORD:-sysmon_secure_password_123}@postgres:5432/${POSTGRES_DB:-sysmon_db}
      SYSMON_SERVER_TOKEN: ${SYSMON_SERVER_TOKEN:-}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      PORT: 8000
    ports:
      - "${SERVER_PORT:-8000}:8000"
    networks:
      - sysmon-net

volumes:
  postgres_data:
    name: sysmon_postgres_data

networks:
  sysmon-net:
    name: sysmon-net
    driver: bridge
